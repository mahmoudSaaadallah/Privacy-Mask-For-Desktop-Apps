name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate PowerShell syntax
        shell: powershell
        run: .\scripts\verify-powershell-syntax.ps1

      - name: Test version policy and prerelease classification
        shell: powershell
        run: .\scripts\test-version-policy.ps1

      - name: Restore
        run: dotnet restore PrivacyMask.Desktop.slnx

      - name: Build
        run: dotnet build PrivacyMask.Desktop.slnx --no-restore

      - name: Test
        run: dotnet test PrivacyMask.Desktop.slnx --no-build

      - name: Test installer transactions
        shell: powershell
        run: .\scripts\test-installer-transaction.ps1

      - name: Test compiled WPF layouts and edit sessions
        shell: powershell
        run: .\scripts\test-gui-smoke.ps1

      - name: Test source and release installer dispatch
        shell: powershell
        run: .\scripts\test-installer-entrypoint.ps1

      - name: Package Windows release
        shell: powershell
        run: .\scripts\package-win-x64-release.ps1 -SkipTests

      - name: Smoke test release package
        shell: powershell
        run: .\scripts\test-release-package.ps1
