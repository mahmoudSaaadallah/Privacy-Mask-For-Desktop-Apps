name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate PowerShell syntax
        shell: powershell
        run: .\scripts\verify-powershell-syntax.ps1

      - name: Restore
        run: dotnet restore PrivacyMask.Desktop.slnx

      - name: Build
        run: dotnet build PrivacyMask.Desktop.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PrivacyMask.Desktop.slnx --no-build --configuration Release

      - name: Package Windows release
        shell: powershell
        run: .\scripts\package-win-x64-release.ps1 -SkipTests

      - name: Smoke test release package and tag
        shell: powershell
        run: .\scripts\test-release-package.ps1 -ExpectedTag "${{ github.ref_name }}"

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\scripts\PrivacyMask.Build.ps1
          $version = Get-PrivacyMaskProductVersion -RepoRoot $PWD.Path
          $assetBaseName = "PrivacyMask-$version-win-x64"
          gh release create "${{ github.ref_name }}" `
            ".\artifacts\release\$assetBaseName.zip" `
            ".\artifacts\release\$assetBaseName.zip.sha256" `
            --repo "${{ github.repository }}" `
            --generate-notes `
            --title "PrivacyMask ${{ github.ref_name }}"
