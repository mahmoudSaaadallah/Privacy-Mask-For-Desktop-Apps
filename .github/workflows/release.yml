name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-environment:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require approved merged tag source before deployment admission
        shell: powershell
        env:
          PRIVACYMASK_RELEASE_TAG: ${{ github.ref_name }}
        run: .\scripts\assert-release-source.ps1 -ExpectedTag $env:PRIVACYMASK_RELEASE_TAG
      - name: Require existing protected release environment without creating it
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACYMASK_RELEASE_REPOSITORY: ${{ github.repository }}
        run: .\scripts\assert-release-environment.ps1 -Repository $env:PRIVACYMASK_RELEASE_REPOSITORY

  package-windows:
    needs: validate-release-environment
    runs-on: windows-latest
    environment: privacy-mask-release
    permissions:
      contents: write
    env:
      PRIVACYMASK_RELEASE_TAG: ${{ github.ref_name }}
      PRIVACYMASK_RELEASE_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require approved merged tag source
        shell: powershell
        run: .\scripts\assert-release-source.ps1 -ExpectedTag $env:PRIVACYMASK_RELEASE_TAG

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate PowerShell syntax
        shell: powershell
        run: .\scripts\verify-powershell-syntax.ps1

      - name: Test version policy and prerelease classification
        shell: powershell
        run: .\scripts\test-version-policy.ps1

      - name: Test draft publication without external writes
        shell: powershell
        run: .\scripts\test-release-publication.ps1

      - name: Test approved release source gate without Git writes
        shell: powershell
        run: .\scripts\test-release-source.ps1

      - name: Test environment admission without external writes
        shell: powershell
        run: .\scripts\test-release-environment.ps1

      - name: Test isolated qualification packet preparation
        shell: powershell
        run: .\scripts\test-update-qualification.ps1

      - name: Test proposed update manifest schemas
        shell: pwsh
        run: .\scripts\test-update-manifest-schema.ps1

      - name: Validate version identity and release tag
        shell: powershell
        run: |
          . .\scripts\PrivacyMask.Build.ps1
          Get-PrivacyMaskReleaseFlags -RepoRoot $PWD.Path -Tag $env:PRIVACYMASK_RELEASE_TAG | Out-Null

      - name: Restore
        run: dotnet restore PrivacyMask.Desktop.slnx

      - name: Build
        run: dotnet build PrivacyMask.Desktop.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PrivacyMask.Desktop.slnx --no-build --configuration Release

      - name: Test source and release installer dispatch
        shell: powershell
        run: .\scripts\test-installer-entrypoint.ps1

      - name: Test compiled WPF layouts and edit sessions
        shell: powershell
        run: .\scripts\test-gui-smoke.ps1

      - name: Package Windows release
        shell: powershell
        run: .\scripts\package-win-x64-release.ps1 -SkipTests

      - name: Smoke test release package and tag
        shell: powershell
        run: .\scripts\test-release-package.ps1 -ExpectedTag $env:PRIVACYMASK_RELEASE_TAG

      - name: Test real signed package with an ephemeral key
        shell: pwsh
        run: .\scripts\test-signed-update-package.ps1

      - name: Build signed update assets
        shell: pwsh
        env:
          PRIVACYMASK_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.PRIVACYMASK_UPDATE_PRIVATE_KEY_PEM }}
          PRIVACYMASK_UPDATE_KEY_ID: ${{ vars.PRIVACYMASK_UPDATE_KEY_ID }}
        run: .\scripts\package-win-x64-update.ps1 -KeyId $env:PRIVACYMASK_UPDATE_KEY_ID -ExpectedTag $env:PRIVACYMASK_RELEASE_TAG

      - name: Independently verify signed update assets
        shell: pwsh
        run: .\scripts\test-update-package.ps1 -ExpectedTag $env:PRIVACYMASK_RELEASE_TAG

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\scripts\PrivacyMask.Release.ps1
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Missing verified source commit.' }
          Publish-PrivacyMaskRelease -RepoRoot $PWD.Path -Tag $env:PRIVACYMASK_RELEASE_TAG `
            -Repository $env:PRIVACYMASK_RELEASE_REPOSITORY -ExpectedCommit $commit
